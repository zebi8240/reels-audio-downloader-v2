<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reels Audio Downloader</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/rad-tool.css?v=5">
<style>body{margin:0;background:#f6f7f9;padding:28px 12px 64px;}</style>
</head><body>
<div class="rad-tool">
        <form class="rad-form" novalidate>
            <div class="rad-bar">
                <svg class="rad-link-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                <label class="screen-reader-text" for="radv2-url-1">Instagram Reel link</label>
                <input type="url" id="radv2-url-1" class="rad-url" placeholder="Paste Instagram Reel or Video link here..." autocomplete="off" inputmode="url" spellcheck="false" />
                <button type="button" class="rad-paste">Paste</button>
                <button type="button" class="rad-clear" aria-label="Clear link" hidden>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
                </button>
                <button type="submit" class="rad-go">
                    <span class="rad-go-text">Extract Audio</span>
                    <span class="rad-go-busy" aria-hidden="true"></span>
                </button>
            </div>
        </form>
        <div class="rad-status" role="status" aria-live="polite" hidden>
            <div class="rad-eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
            <span class="rad-status-text">Checking link…</span>
        </div>
        <div class="rad-error" role="alert" hidden>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v5M12 16.5v.01"></path></svg>
            <p class="rad-error-text"></p>
        </div>
        <section class="rad-result" aria-label="Extracted audio" hidden>
            <div class="rad-media">
                <div class="rad-cover-wrap">
                    <img class="rad-cover is-missing" alt="" width="108" height="144" referrerpolicy="no-referrer" />
                </div>
                <div class="rad-details">
                    <span class="rad-badge">Original audio</span>
                    <p class="rad-title">Instagram audio</p>
                    <p class="rad-meta"></p>
                    <p class="rad-caption" hidden></p>
                </div>
            </div>
            <audio class="rad-audio" controls preload="metadata"></audio>
            <div class="rad-dl">
                <button type="button" class="rad-mp3">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg>
                    <span class="rad-dl-label">Download MP3</span>
                </button>
                <button type="button" class="rad-m4a"><span class="rad-dl-label">M4A (Original)</span></button>
            </div>
            <div class="rad-foot">
                <button type="button" class="rad-again">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>
                    Download another
                </button>
            </div>
        </section>
        <p class="rad-note">This tool is intended only for downloading audio from Instagram reels you own or have permission to use.</p>
    </div>
<script>window.radv2Ajax={ajaxUrl:'/api/audio',nonce:'preview'};</script>
<script src="/rad-tool.js?v=7"></script>
</body></html>
